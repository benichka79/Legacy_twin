services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
      POSTGRES_DB: legacy_twin
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d legacy_twin"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata: {}
