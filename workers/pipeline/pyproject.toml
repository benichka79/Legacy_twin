[project]
name = "pipeline"
version = "0.0.1"
description = "Legacy Twin processing pipeline worker: ingest, transcribe, segment, extract"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "certifi>=2024.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]
